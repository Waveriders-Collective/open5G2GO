name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            poetry.lock
            requirements-ci.txt
      - name: Install audit tooling
        run: python -m pip install -r requirements-ci.txt
      - name: Audit locked application and development dependencies
        run: |
          poetry check --lock
          python scripts/audit-python-lock.py
      - name: Audit CI tooling
        run: pip-audit --requirement requirements-ci.txt

  frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web_frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json
          package-manager-cache: false
      - name: Audit production dependencies at every severity
        run: npm audit --omit=dev --audit-level=low
      - name: Audit all dependencies for high and critical vulnerabilities
        # Remaining moderate lint-tool findings are tracked in the security review.
        # npm still prints them; no advisories are suppressed.
        run: npm audit --audit-level=high

  review:
    name: Dependency review
    # Requires the repository dependency graph; full audits above always run.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
