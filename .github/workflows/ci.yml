name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install application and test dependencies
        run: python -m pip install . -r requirements-ci.txt
      - name: Check Python lint
        run: ruff check .
      - name: Run Python tests
        run: python -m pytest -q

  shell:
    name: Shell and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: |
          for script in install.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: Run ShellCheck
        run: shellcheck --severity=warning install.sh scripts/*.sh
      - name: Validate Compose configurations
        run: |
          for config in docker-compose*.yml; do
            docker compose --env-file env.example -f "$config" config --quiet
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web_frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
