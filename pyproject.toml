[tool.poetry]
name = "open5g2go"
version = "0.1.0"
description = "Homelab toolkit for private 4G cellular networks with Open5GS"
authors = ["Waveriders Collective <info@waveriders.io>"]
packages = [{include = "opensurfcontrol"}, {include = "web_backend"}]
readme = "README.md"
license = "AGPL-3.0-or-later"

[tool.poetry.scripts]
opensurfcontrol-web = "web_backend.main:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135.0"
# Security floor for the form parser and URL validation used by FastAPI.
starlette = ">=1.3.1,<2.0.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pymongo = "^4.6.0"
# DNS parser security fixes used by PyMongo require Python 3.11 or newer.
dnspython = ">=2.9.0,<3.0.0"
pyyaml = "^6.0.1"
python-multipart = ">=0.0.32,<0.1.0"
httpx = "^0.27.0"
pysnmp = "^6.0.0"  # For Baicells eNodeB SNMP monitoring

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.1"
pytest-cov = "^4.1.0"
cryptography = "^50.0.2"  # Exercise SIM key generation tests instead of skipping them
black = "^26.10.1"
ruff = "^0.1.6"
mypy = ">=1.7,<3.0"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
