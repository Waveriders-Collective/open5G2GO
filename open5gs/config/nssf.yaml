# Open5GS NSSF (Network Slice Selection Function) Configuration
# Slice selection for 5G SA

logger:
  file:
    path: /var/log/open5gs/nssf.log
  level: info

global:
  max:
    ue: 100

nssf:
  sbi:
    server:
      - address: 172.26.0.36
        port: 7777
    client:
      nrf:
        - uri: http://172.26.0.30:7777

  nsi:
    - addr: 172.26.0.30
      port: 7777
      s_nssai:
        sst: 1
